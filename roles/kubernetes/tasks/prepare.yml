---
- name: Upgrade Kubernetes packages only
  ansible.builtin.include_tasks:
    file: upgrade-packages.yml
    apply:
      become: true
  when: kubernetes_upgrade_mode | bool

- name: Install Kubernetes packages
  ansible.builtin.include_tasks:
    file: install-kubernetes.yml
    apply:
      become: true
  when: not (kubernetes_upgrade_mode | bool)

- name: Configure containerd modules
  block:
    - name: Create the containerd modules file
      ansible.builtin.file:
        path: /etc/modules-load.d/containerd.conf
        state: touch
        mode: '0644'

    - name: Configure the overlay module
      ansible.builtin.lineinfile:
        path: /etc/modules-load.d/containerd.conf
        regexp: '^overlay'
        line: overlay

    - name: Configure the br_netfilter module
      ansible.builtin.lineinfile:
        path: /etc/modules-load.d/containerd.conf
        regexp: '^br_netfilter'
        line: br_netfilter

    - name: Load the overlay module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load the br_netfilter module
      community.general.modprobe:
        name: br_netfilter
        state: present
  become: true
  when: not (kubernetes_upgrade_mode | bool)

- name: Configure containerd
  block:
    - name: Generate the default containerd config
      ansible.builtin.shell:
        cmd: containerd config default > /etc/containerd/config.toml

    - name: Set the containerd cgroup driver
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^\s*SystemdCgroup\s*='
        line: '\g<0> true'
        backrefs: true

    - name: Enable the containerd CRI plugin
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^disabled_plugins'
        line: 'disabled_plugins = []'

    - name: Restart containerd
      ansible.builtin.service:
        name: containerd.service
        state: restarted
        enabled: true
  become: true
  when: not (kubernetes_upgrade_mode | bool)

- name: Configure sysctl for Kubernetes networking
  block:
    - name: Enable net.bridge.bridge-nf-call-iptables
      ansible.posix.sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: '1'
        sysctl_set: true
        reload: true

    - name: Enable net.ipv4.ip_forward
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        reload: true

    - name: Enable net.bridge.bridge-nf-call-ip6tables
      ansible.posix.sysctl:
        name: net.bridge.bridge-nf-call-ip6tables
        value: '1'
        sysctl_set: true
        reload: true
  become: true
  when: not (kubernetes_upgrade_mode | bool)

- name: Disable swap
  block:
    - name: Disable active swap
      ansible.builtin.command:
        cmd: swapoff -a
      changed_when: false

    - name: Disable the swap image in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^(?!#).*/swap.img.*$'
        line: '# \g<0>'
        backrefs: true
  become: true
  when: not (kubernetes_upgrade_mode | bool)
