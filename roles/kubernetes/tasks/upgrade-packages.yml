---
- name: Validate Kubernetes upgrade package variables
  ansible.builtin.assert:
    that:
      - kubernetes_version is match('^1\.[0-9]+$')
      - kubernetes_upgrade_package_stage in ['kubeadm', 'node', 'all']
    fail_msg: >-
      Set kubernetes_version to a minor version such as 1.35 and set a valid
      kubernetes_upgrade_package_stage.

- name: Ensure the Kubernetes apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install the Kubernetes repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
    force: true

- name: Select the Kubernetes minor apt repository
  ansible.builtin.copy:
    content: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
      https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /
    dest: /etc/apt/sources.list.d/kubernetes.list
    owner: root
    group: root
    mode: '0644'

- name: Update the apt package index
  ansible.builtin.apt:
    update_cache: true

- name: Unhold kubeadm
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: install
  when: kubernetes_upgrade_package_stage in ['kubeadm', 'all']

- name: Install the target kubeadm version
  ansible.builtin.apt:
    name: "kubeadm={{ kubernetes_version }}.*"
    state: present
    allow_change_held_packages: true
  when: kubernetes_upgrade_package_stage in ['kubeadm', 'all']

- name: Hold kubeadm
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: hold
  when: kubernetes_upgrade_package_stage in ['kubeadm', 'all']

- name: Unhold kubelet and kubectl
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
    - kubelet
    - kubectl
  when: kubernetes_upgrade_package_stage in ['node', 'all']

- name: Install the target kubelet and kubectl versions
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_version }}.*"
      - "kubectl={{ kubernetes_version }}.*"
    state: present
    allow_change_held_packages: true
  when: kubernetes_upgrade_package_stage in ['node', 'all']

- name: Hold kubelet and kubectl
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubectl
  when: kubernetes_upgrade_package_stage in ['node', 'all']

- name: Reload systemd and restart kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    daemon_reload: true
    state: restarted
    enabled: true
  when: kubernetes_upgrade_package_stage in ['node', 'all']

- name: Read installed Kubernetes package versions
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Version}
      - "{{ item }}"
  loop: >-
    {{ ['kubeadm'] if kubernetes_upgrade_package_stage == 'kubeadm'
       else ['kubelet', 'kubectl'] if kubernetes_upgrade_package_stage == 'node'
       else ['kubeadm', 'kubelet', 'kubectl'] }}
  register: kubernetes_installed_package_versions
  changed_when: false
  check_mode: false

- name: Verify installed Kubernetes package versions
  ansible.builtin.assert:
    that:
      - item.stdout is match('^' ~ (kubernetes_version | regex_escape) ~ '\.')
    fail_msg: "{{ item.item }} is {{ item.stdout }}, expected the {{ kubernetes_version }} minor"
  loop: "{{ kubernetes_installed_package_versions.results }}"
