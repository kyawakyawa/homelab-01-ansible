---
- name: Install nerdctl
  block:
    - name: Download
      ansible.builtin.get_url:
        url: "https://github.com/containerd/nerdctl/releases/download/v{{ nerdctl_version }}/nerdctl-{{ nerdctl_version }}-linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}.tar.gz"
        dest: /tmp/nerdctl.tar.gz
        mode: '0700'
        force: yes

    - name: Extract nerdctl.tar.gz into /tmp
      ansible.builtin.unarchive:
        src: /tmp/nerdctl.tar.gz
        dest: /tmp/
        remote_src: true

    - name: Copy
      ansible.builtin.copy:
        src: /tmp/nerdctl
        dest: /usr/local/bin/nerdctl
        remote_src: true
        owner: "root"
        mode: '0755'

    - name: Ensure the cni plugins directory exists
      ansible.builtin.file:
        path: /opt/cni/bin
        state: directory
        mode: '0755'

    - name: Download CNI plugin
      ansible.builtin.get_url:
        url: "https://github.com/containernetworking/plugins/releases/download/{{ cni_plugins_version }}/cni-plugins-linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}-{{ cni_plugins_version }}.tgz"
        dest: /tmp/cni-plugins.tgz
        mode: '0700'
        force: yes

    - name: Extract cni-plugins.tgz into /tmp
      ansible.builtin.unarchive:
        src: /tmp/cni-plugins.tgz
        dest: /opt/cni/bin/
        remote_src: true
        mode: '0755'
  become: true
