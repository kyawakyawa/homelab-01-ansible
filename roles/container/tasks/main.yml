---
- name: Containerd
  include_tasks: containerd.yml
- name: Nerdctl
  include_tasks: nerdctl.yml
- name: Buildkit
  include_tasks: buildkit.yml
- name: DO NOT INSTALL Docker!!!
  ansible.builtin.apt:
    state: absent
    autoremove: true
    update_cache: true
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd
  become: true
