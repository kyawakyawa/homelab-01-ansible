---
- name: Setup nodes
  hosts: all
  tasks:
    - name: Run chrony role
      ansible.builtin.import_role:
        name: chrony
      become: true

    - name: Run packages role
      import_role:
        name: packages
      become: true

    - name: Run apparmor role
      import_role:
        name: apparmor
      become: true

    - name: Run container role
      import_role:
        name: container
      become: true
      when:
        - ansible_facts["system"] == "Linux"
        - ansible_facts["architecture"] in ["x86_64", "aarch64"]

    - name: Run editor role
      import_role:
        name: editor
      become: true
